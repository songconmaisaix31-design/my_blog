# 首页显示的文章分类
mainSections = ["post"]

# RSS 输出完整内容
rssFullContent = true

# 网站图标
favicon = "img/favicon.png"

# 文章排序方式: "default" 或 "lastmod"
SortBy = "default"

[footer]
    since      = 2025
    customText = "用 ❤️ 和 Hugo 搭建"

[dateFormat]
    published   = "2006年01月02日"
    lastUpdated = "2006年01月02日"

[sidebar]
    emoji    = "✨"
    subtitle = "记录生活，分享技术，热爱开源"
    avatar   = "img/avatar.jpg"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "采用 CC BY-NC-SA 4.0 许可协议"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives",  params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## 评论系统配置
[comments]
    enabled  = false
    provider = ""

    # 启用评论后取消注释以下配置
    # [comments.disqus]
    #     shortname = "your-disqus-shortname"
    
